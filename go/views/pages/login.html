{{define "content"}}
<div class="max-w-md mx-auto py-20">
    <div class="bg-dark-card border border-dark-border rounded-lg p-8">
        <h1 class="text-2xl font-display tracking-wider mb-6 text-center">Connexion</h1>
        
        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Email</label>
                <input type="email" name="email" required
                    class="w-full px-4 py-2 bg-dark-surface border border-dark-border rounded-lg focus:outline-none focus:border-brand">
            </div>
            
            <div>
                <label class="block text-sm font-medium mb-1">Mot de passe</label>
                <input type="password" name="password" required
                    class="w-full px-4 py-2 bg-dark-surface border border-dark-border rounded-lg focus:outline-none focus:border-brand">
            </div>
            
            <button type="submit" class="w-full bg-brand text-white py-2 rounded-lg hover:bg-brand/80 transition-colors">
                Se connecter
            </button>
        </form>
        
        <p class="text-center text-muted-foreground mt-4">
            Pas de compte ? <a href="/register" class="text-brand hover:underline">S'inscrire</a>
        </p>
    </div>
</div>
{{end}}
